name: bible
description: Offline Bible reader with dynamic verse wallpapers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State / DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^16.0.0

  # Database
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.34
  sqlite3: ^2.7.0

  # Storage / files
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^11.0.0
  file_picker: ^10.2.0
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  gal: ^2.3.1
  workmanager: ^0.9.0
  dio: ^5.8.0
  connectivity_plus: ^6.1.4
  image: ^4.5.4
  home_widget: ^0.9.0
  crypto: ^3.0.6
  google_sign_in: ^6.2.1

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ^2.28.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/bible/
    - assets/wallpapers/seed/

# ── Release assets (dart run flutter_launcher_icons / flutter_native_splash:create)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#21335C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
  min_sdk_android: 26

flutter_native_splash:
  color: "#21335C"
  color_dark: "#0D1529"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#21335C"
    color_dark: "#0D1529"
    image: assets/icon/splash_logo.png
    icon_background_color: "#21335C"
    icon_background_color_dark: "#0D1529"
  ios: true
  android: true
  web: false
